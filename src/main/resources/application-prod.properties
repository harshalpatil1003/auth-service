# Production profile (SPRING_PROFILES_ACTIVE=prod). Values without defaults are required, and
# ProductionConfigCheck refuses unsafe ones.

# Production key pair, mounted as files (never the development pair from ./config/certs)
credintel.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}
credintel.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.clean-disabled=true

# Eureka is optional: with EUREKA_CLIENT_ENABLED=false services use fixed addresses instead
# (ProductionConfigCheck requires EUREKA_URL whenever Eureka is on)
eureka.client.service-url.defaultZone=${EUREKA_URL:}
credintel.internal.token=${INTERNAL_API_TOKEN}

server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

logging.structured.format.console=ecs
logging.level.root=INFO
