spring.application.name=auth-service
server.port=8083

server.servlet.context-path=/auth-service

frontend.baseurl=http://localhost:3000
frontend.index=/index.html

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationMinimum256BitsRequiredForHS256Algorithm
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
jwt.issuer=auth-service

# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/credintel_auth
spring.datasource.username=Dummy
spring.datasource.password=Dummy

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true


# eureka service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

credintel.jwt.public-key=classpath:certs/jwt_public.pem
credintel.jwt.private-key=classpath:certs/jwt_private.pem
credintel.jwt.issuer=auth-service

# Flyway: schema is owned by migrations in db/migration; Hibernate only validates it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

