# Settings here are local-development defaults; nothing secret belongs in this file. Secrets come
# from environment variables, or locally from the untracked ./config/ folder: Spring Boot loads
# ./config/application.properties automatically, and the development key pair lives in
# ./config/certs. Production: SPRING_PROFILES_ACTIVE=prod, see application-prod.properties.
spring.application.name=auth-service
server.port=${PORT:8083}
server.servlet.context-path=/auth-service

# Token lifetimes (ms). Access tokens are short-lived: the frontend refreshes them on a 401, and
# each refresh re-checks that the account is still active.
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_TTL_MS:1800000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_TTL_MS:604800000}

# RS256 key pair: the private key signs, the public key is shared with the services that verify
credintel.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:file:config/certs/jwt_private.pem}
credintel.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:file:config/certs/jwt_public.pem}
credintel.jwt.issuer=auth-service

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credintel_auth}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns the schema (db/migration). Databases created from the old sql/v1.sql have the users
# table but no history: they are baselined at V1, so only later migrations run on them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# eureka service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Accounts are created through invites (internal API); open sign-up stays off
credintel.auth.registration-enabled=false
# Failed logins before an account is locked, and for how long
credintel.auth.max-failed-logins=5
credintel.auth.lockout-minutes=15
# Shared secret for /internal endpoints; must match the CRM backend's value. The dev default is
# refused at startup under the prod profile (ProductionConfigCheck).
credintel.internal.token=${INTERNAL_API_TOKEN:dev-only-internal-token-change-me}

# Sign in with Google / Microsoft / an OpenID Connect provider: each is on when it has a client id.
# Register the callback <public url>/auth-service/api/v1/auth/sso/<google|microsoft|oidc>/callback.
credintel.sso.public-url=${PUBLIC_URL:http://localhost:3000}
credintel.sso.google.client-id=${GOOGLE_CLIENT_ID:}
credintel.sso.google.client-secret=${GOOGLE_CLIENT_SECRET:}
credintel.sso.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
credintel.sso.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
# common (any work or personal account), organizations, consumers, or one directory's id
credintel.sso.microsoft.tenant=${MICROSOFT_TENANT:common}
credintel.sso.oidc.issuer=${OIDC_ISSUER:}
credintel.sso.oidc.name=${OIDC_NAME:Single sign-on}
credintel.sso.oidc.client-id=${OIDC_CLIENT_ID:}
credintel.sso.oidc.client-secret=${OIDC_CLIENT_SECRET:}

# Health on a separate port that the gateway never routes
management.server.port=${MANAGEMENT_PORT:8183}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

server.shutdown=graceful
